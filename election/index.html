<style>
/* ── tokens ── */
:root {
  --bg: #F4F3EF;
  --surface: #FFFFFF;
  --text: #1A1A1A;
  --muted: #6B6360;
  --border: #E0DDD8;
  --header-bg: #0D2040;
  --header-text: #FFFFFF;
  --filter-bg: #EEECEA;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.12);

  --ndp:   #E8721A;
  --con:   #003F8C;
  --grn:   #2E7D32;
  --cbc:   #00695C;
  --ind:   #546E7A;

  --ndp-bg:   #FFF3E6;
  --con-bg:   #E8EEF7;
  --grn-bg:   #E8F5E9;
  --cbc-bg:   #E0F2F1;
  --ind-bg:   #ECEFF1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111827;
    --surface: #1F2937;
    --text: #F3F0EB;
    --muted: #9CA3AF;
    --border: #374151;
    --filter-bg: #1A2332;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-hover: 0 4px 12px rgba(0,0,0,.5);
    --ndp-bg:   #2A1800;
    --con-bg:   #001833;
    --grn-bg:   #0A1F0A;
    --cbc-bg:   #0A2320;
    --ind-bg:   #0E1A20;
  }
}
:root[data-theme="dark"] {
  --bg: #111827;
  --surface: #1F2937;
  --text: #F3F0EB;
  --muted: #9CA3AF;
  --border: #374151;
  --filter-bg: #1A2332;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.5);
  --ndp-bg:   #2A1800;
  --con-bg:   #001833;
  --grn-bg:   #0A1F0A;
  --cbc-bg:   #0A2320;
  --ind-bg:   #0E1A20;
}

/* ── reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── header ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  color: var(--header-text);
  padding: 0 20px;
}
.header-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 0;
  flex-wrap: wrap;
}
.site-brand { flex: 0 0 auto; }
.site-name {
  font-family: 'Libre Baskerville', Georgia, serif;
  font-style: italic;
  font-size: 1.35rem; font-weight: 400;
  letter-spacing: -.01em;
  color: #fff;
  text-decoration: none;
}
.site-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.site-meta {
  font-size: 0.7rem; color: rgba(255,255,255,.5);
  letter-spacing: .04em; text-transform: uppercase;
  margin-top: 1px;
}
.header-nav {
  display: flex; gap: 12px; align-items: center;
}
.header-nav a {
  font-size: 0.75rem; color: rgba(255,255,255,.6);
  text-decoration: none; letter-spacing: .03em;
  padding: 3px 0;
  border-bottom: 1px solid transparent;
  transition: color .15s, border-color .15s;
}
.header-nav a:hover { color: #fff; border-color: rgba(255,255,255,.4); }
.header-nav a.active { color: #fff; border-color: rgba(255,255,255,.6); }
.seat-bar-wrap { flex: 1; min-width: 200px; }
.seat-pills {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  justify-content: flex-end;
}
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: .03em;
  padding: 3px 8px 3px 6px;
  border-radius: 20px; line-height: 1; cursor: default;
}
.pill-count { font-size: 0.85rem; font-weight: 700; }
.pill.ndp { background: rgba(232,114,26,.25); color: #FFB877; border: 1px solid rgba(232,114,26,.4); }
.pill.con { background: rgba(0,63,140,.35);   color: #7BAEE8; border: 1px solid rgba(0,63,140,.5); }
.pill.grn { background: rgba(46,125,50,.3);   color: #81C784; border: 1px solid rgba(46,125,50,.5); }
.pill.cbc { background: rgba(0,105,92,.3);    color: #4DB6AC; border: 1px solid rgba(0,105,92,.5); }
.pill.ind { background: rgba(84,110,122,.3);  color: #90A4AE; border: 1px solid rgba(84,110,122,.5); }

.seat-prop-bar { height: 3px; display: flex; width: 100%; overflow: hidden; margin-top: 4px; }
.seat-prop-bar span { display: block; }

/* ── controls bar ── */
.controls-bar {
  position: sticky; top: 60px; z-index: 90;
  background: var(--filter-bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
}
.controls-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.filter-btn {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.75rem; font-weight: 600;
  letter-spacing: .03em;
  padding: 4px 10px; border-radius: 20px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: opacity .15s, box-shadow .15s;
  line-height: 1.4;
}
.filter-btn.active { opacity: 1; box-shadow: var(--shadow); }
.filter-btn:not(.active) { opacity: .45; }
.filter-btn:hover { opacity: .9; }
.filter-btn.all   { background: var(--filter-bg); color: var(--text); border-color: var(--border); }
.filter-btn.ndp   { background: var(--ndp-bg); color: var(--ndp); border-color: var(--ndp); }
.filter-btn.con   { background: var(--con-bg); color: var(--con); border-color: var(--con); }
.filter-btn.grn   { background: var(--grn-bg); color: var(--grn); border-color: var(--grn); }
.filter-btn.cbc   { background: var(--cbc-bg); color: var(--cbc); border-color: var(--cbc); }
.filter-btn.ind   { background: var(--ind-bg); color: var(--ind); border-color: var(--ind); }

.result-count { font-size: 0.72rem; color: var(--muted); letter-spacing: .03em; padding: 0 4px; }

/* ── main grid ── */
main { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }
.riding-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}

/* ── riding card ── */
.riding-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  display: flex;
  overflow: hidden;
  transition: box-shadow .18s, transform .18s, opacity .2s;
  min-height: 90px;
}
.riding-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.riding-card.dim { opacity: .35; }

.winner-stripe { width: 4px; flex: 0 0 4px; }
.winner-stripe.ndp { background: var(--ndp); }
.winner-stripe.con { background: var(--con); }
.winner-stripe.grn { background: var(--grn); }

.card-body {
  padding: 10px 11px 9px;
  display: flex; flex-direction: column; gap: 6px;
  flex: 1; min-width: 0;
}

.riding-name {
  font-size: 0.8rem; font-weight: 700; color: var(--text);
  line-height: 1.25;
}
.won-badge {
  display: inline-block;
  font-size: 0.58rem; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase;
  padding: 1px 5px; border-radius: 10px; line-height: 1.5;
  margin-left: 4px; vertical-align: middle;
}
.won-badge.ndp { background: var(--ndp-bg); color: var(--ndp); }
.won-badge.con { background: var(--con-bg); color: var(--con); }
.won-badge.grn { background: var(--grn-bg); color: var(--grn); }

.candidate-name {
  font-size: 0.8rem; font-weight: 600; color: var(--text);
  flex: 1;
  line-height: 1.3;
}
.candidate-name.tbd {
  font-style: italic; font-weight: 400; color: var(--muted);
}

.party-dots {
  display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
  margin-top: auto;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex: 0 0 8px;
  title: attr(data-party);
}
.dot.ndp { background: var(--ndp); }
.dot.con { background: var(--con); }
.dot.grn { background: var(--grn); }
.dot.cbc { background: var(--cbc); }
.dot.ind { background: var(--ind); }

/* ── footer ── */
footer {
  background: var(--header-bg);
  color: rgba(255,255,255,.5);
  padding: 16px 20px;
  margin-top: 0;
}
.footer-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap;
}
.footer-copy, .footer-copy a { font-size: 0.8rem; color: rgba(255,255,255,.5); text-decoration: none; }
.footer-copy a:hover { color: #fff; }
.footer-gh a {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; color: rgba(255,255,255,.5); text-decoration: none;
}
.footer-gh a:hover { color: #fff; }
.footer-gh svg { width: 16px; height: 16px; fill: currentColor; }
</style>

function candidateCounts() {
  const c = {};
  PARTY_ORDER.forEach(p => c[p] = 0);
  RIDINGS.forEach(r => {
    PARTY_ORDER.forEach(p => {
      if (r.candidates[p]) c[p]++;
    });
  });
  return c;
}

// ─────────────────────────────────────────────
// RENDER HEADER
// ─────────────────────────────────────────────
function renderHeader() {
  const counts = candidateCounts();
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const pills = document.getElementById("countPills");
  const bar   = document.getElementById("propBar");
  pills.innerHTML = "";
  bar.innerHTML   = "";
  PARTY_ORDER.forEach(p => {
    if (!counts[p]) return;
    const { label, key, color } = PARTIES[p];
    const abbr = { NDP:"NDP", Conservative:"Con", Green:"Green", CentreBC:"CentreBC", Independent:"Ind." }[p] || p;
    pills.innerHTML += `<span class="pill ${key}" title="${label} – ${counts[p]} candidates nominated"><span class="pill-count">${counts[p]}</span> ${abbr}</span>`;
    bar.innerHTML   += `<span style="width:${(counts[p]/total*100).toFixed(2)}%;background:${color};opacity:.8"></span>`;
  });
}

// ─────────────────────────────────────────────
// RENDER FILTER BUTTONS
// ─────────────────────────────────────────────
function renderFilters() {
  const counts = candidateCounts();
  const fg = document.getElementById("filterGroup");
  fg.innerHTML = `<button class="filter-btn all ${activeParty==='all'?'active':''}" data-party="all">All parties</button>`;
  PARTY_ORDER.forEach(p => {
    const { label, key } = PARTIES[p];
    const cnt = counts[p];
    fg.innerHTML += `<button class="filter-btn ${key} ${activeParty===p?'active':''}" data-party="${p}">${label} (${cnt})</button>`;
  });
  fg.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeParty = btn.dataset.party;
      renderAll();
    });
  });
}

// ─────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("ridingGrid");
  let shown = 0;

  grid.innerHTML = RIDINGS.map(r => {
    const winnerKey = (PARTIES[r.winner2024] || {}).key || "con";

    // Determine if this card is "active" for the current filter
    const isAll = activeParty === "all";
    const hasCandidate = !!r.candidates[activeParty];
    const isActive = isAll || hasCandidate;

    if (isActive) shown++;

    // Candidate name line
    let candidateLine = "";
    if (!isAll) {
      const name = r.candidates[activeParty];
      if (name && name !== "TBD") {
        candidateLine = `<div class="candidate-name">${name}</div>`;
      } else if (name === "TBD") {
        candidateLine = `<div class="candidate-name tbd">Candidate TBD</div>`;
      } else {
        candidateLine = `<div class="candidate-name tbd">Not yet nominated</div>`;
      }
    }

    // Party dots — which parties have a candidate in this riding
    const dots = PARTY_ORDER
      .filter(p => r.candidates[p])
      .map(p => `<span class="dot ${PARTIES[p].key}" title="${PARTIES[p].label}"></span>`)
      .join("");

    return `
      <div class="riding-card ${isActive ? '' : 'dim'}">
        <div class="winner-stripe ${winnerKey}" title="2024: ${r.winner2024}"></div>
        <div class="card-body">
          <div class="riding-name">${r.name}</div>
          ${candidateLine}
          <div class="party-dots">${dots}</div>
        </div>
      </div>`;
  }).join("");

  document.getElementById("resultCount").textContent =
    activeParty === "all"
      ? `${RIDINGS.length} ridings`
      : `${shown} of ${RIDINGS.length} nominated`;
}

function renderAll() {
  renderHeader();
  renderFilters();
  renderGrid();
}

renderAll();
</script>
</body>
</html>
